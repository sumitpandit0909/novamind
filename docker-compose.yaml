version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379" # Host:6380 -> Container:6379 (avoid conflict with vanshu-redis on 6379)
    volumes:
      - redis_data:/data

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "8001:8000" # Host:8001 -> Container:8000 (avoid conflict with vanshu-web on 8000)
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - qdrant
      - redis
    volumes:
      - temp_uploads:/app/temp_uploads

volumes:
  qdrant_storage:
  redis_data:
  temp_uploads:
